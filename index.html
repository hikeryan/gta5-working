<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>GrandV Launcher</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0%,#29422d 0,transparent 55%),#080b0e;color:#edf2ed;font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    main{max-width:550px;width:100%;background:#121a1a;border:1px solid #405847;border-radius:20px;padding:32px;box-shadow:0 20px 80px #0006}
    h1{font-size:2rem;margin:0 0 8px}p{color:#c5d2c7}.play{display:block;text-align:center;margin:24px 0 10px;border-radius:10px;background:#8bc66e;color:#101b0c;padding:14px 22px;font-size:1.1rem;font-weight:750;text-decoration:none}.play:hover,.play:focus-visible{background:#b1e895}.note{font-size:.9rem;color:#afbcaf}code{color:#d9efcf}
  </style>
</head>
<body>
  <main>
    <h1>GrandV</h1>
    <p>Browser game launcher</p>
    <a class="play" href="./game.html">Open game page</a>
    <p class="note">This homepage only opens <code>game.html</code>. The game requires its actual data assets, engine dependencies, and compatible hosting configuration. A loading screen or error does not mean those files are installed.</p>
  </main>
</body>
</html>
